name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão a publicar (ex.: 1.0.0)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

env:
  PACKAGE_ID: OpBlazorUI.Base
  PACKAGE_PROJECT: src/Components/OpBlazorUI.Base/OpBlazorUI.Base.csproj
  FEED_OWNER: victorAFRodrigues

jobs:
  publish:
    name: Publicar no GitHub Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Resolver versão
        id: version
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "Versão inválida: '$VERSION'. Use o formato 1.2.3 ou 1.2.3-preview.1." >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publicando $PACKAGE_ID $VERSION"

      - name: Restore
        run: dotnet restore "$PACKAGE_PROJECT"

      - name: Pack
        run: |
          dotnet pack "$PACKAGE_PROJECT" \
            --configuration Release \
            --no-restore \
            -p:Version=${{ steps.version.outputs.version }} \
            --output ./artifacts

      - name: Autenticar no GitHub Packages
        run: |
          dotnet nuget add source \
            --username ${{ github.actor }} \
            --password ${{ secrets.GITHUB_TOKEN }} \
            --store-password-in-clear-text \
            --name github \
            "https://nuget.pkg.github.com/$FEED_OWNER/index.json"

      - name: Push para o GitHub Packages
        run: |
          dotnet nuget push "./artifacts/$PACKAGE_ID.${{ steps.version.outputs.version }}.nupkg" \
            --source github \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --skip-duplicate

      - name: Criar/atualizar GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" ./artifacts/*.nupkg --clobber
          else
            gh release create "$GITHUB_REF_NAME" ./artifacts/*.nupkg \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
