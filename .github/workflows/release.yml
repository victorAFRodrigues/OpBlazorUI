name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão a publicar (ex.: 1.0.0)'
        required: true
        type: string

permissions:
  contents: write
  id-token: write # OIDC para o Trusted Publishing do NuGet.org

env:
  TEST_PROJECT: tests/OpBlazorUI.Playwright/OpBlazorUI.Playwright.csproj

jobs:
  publish:
    name: Publicar no NuGet.org
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolver versão
        id: version
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "Versão inválida: '$VERSION'. Use o formato 1.2.3 ou 1.2.3-preview.1." >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publicando $VERSION"

      - name: Restore
        run: dotnet restore OpBlazorUI.slnx

      # Build + testes antes de publicar: a tag só gera pacote se o commit compilar e passar.
      - name: Build (Debug) para testes
        run: dotnet build OpBlazorUI.slnx --configuration Debug --no-restore

      - name: Instalar Chromium (Playwright)
        run: pwsh tests/OpBlazorUI.Playwright/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium

      - name: Testes
        run: dotnet test "$TEST_PROJECT" --configuration Debug --no-build

      - name: Pack
        run: |
          dotnet pack src/Components/OpBlazorUI/OpBlazorUI.csproj \
            --configuration Release \
            -p:Version=${{ steps.version.outputs.version }} \
            --output ./artifacts

          dotnet pack src/Components/OpBlazorUI.Charts/OpBlazorUI.Charts.csproj \
            --configuration Release \
            -p:Version=${{ steps.version.outputs.version }} \
            --output ./artifacts

      - name: Gerar documentação para agentes
        run: |
          dotnet run --project tools/docs-gen/OpBlazorUI.DocsGen.csproj \
            --configuration Release -- generate --out artifacts/docs \
            --version ${{ steps.version.outputs.version }}
          dotnet run --project tools/docs-gen/OpBlazorUI.DocsGen.csproj \
            --configuration Release --no-build -- verify --dir artifacts/docs

      # Trusted Publishing: a política no NuGet.org é vinculada a este repositório e ao release.yml.
      # A API key temporária vale 1h, então o login acontece imediatamente antes do push.
      - name: Autenticar no NuGet.org (OIDC)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push para o NuGet.org
        run: |
          dotnet nuget push "./artifacts/*.${{ steps.version.outputs.version }}.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} \
            --skip-duplicate

      - name: Criar/atualizar GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              ./artifacts/*.nupkg \
              ./artifacts/docs/manifest.json \
              ./artifacts/docs/llms.txt \
              ./artifacts/docs/llms-full.txt \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              ./artifacts/*.nupkg \
              ./artifacts/docs/manifest.json \
              ./artifacts/docs/llms.txt \
              ./artifacts/docs/llms-full.txt \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
