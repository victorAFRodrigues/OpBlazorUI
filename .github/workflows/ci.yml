name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore OpBlazorUI.slnx

      - name: Build
        run: dotnet build OpBlazorUI.slnx --configuration Release --no-restore

      - name: Pack da biblioteca
        run: |
          dotnet pack src/Components/OpBlazorUI/OpBlazorUI.csproj \
            --configuration Release \
            --no-restore \
            --output ./artifacts

      - name: Pack dos gráficos
        run: |
          dotnet pack src/Components/OpBlazorUI.Charts/OpBlazorUI.Charts.csproj \
            --configuration Release \
            --no-restore \
            --output ./artifacts

  test:
    name: Test (Playwright)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore OpBlazorUI.slnx

      - name: Build
        run: dotnet build OpBlazorUI.slnx --configuration Debug --no-restore

      - name: Instalar Chromium (Playwright)
        run: pwsh tests/OpBlazorUI.Playwright/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium

      - name: Testes
        run: dotnet test tests/OpBlazorUI.Playwright/OpBlazorUI.Playwright.csproj --configuration Debug --no-build

  themes:
    name: Temas gerados em dia
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar o gerador de temas
        working-directory: tools/theme-gen
        run: npm ci

      - name: Regenerar os temas
        working-directory: tools/theme-gen
        run: npm run build

      - name: Falhar se houver diff (temas desatualizados)
        run: |
          if ! git diff --exit-code -- src/Components/OpBlazorUI/wwwroot/themes; then
            echo "::error::Os temas em wwwroot/themes estão desatualizados. Rode 'npm run build' em tools/theme-gen e commite o resultado."
            exit 1
          fi

  docs:
    name: Docs em dia
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore OpBlazorUI.slnx

      - name: Build do gerador
        run: dotnet build tools/docs-gen/OpBlazorUI.DocsGen.csproj --configuration Release --no-restore

      - name: Gerar o manifesto
        run: >
          dotnet run --project tools/docs-gen/OpBlazorUI.DocsGen.csproj
          --configuration Release --no-build --
          generate --out artifacts/docs

      - name: Verificar os artefatos de IA
        run: >
          dotnet run --project tools/docs-gen/OpBlazorUI.DocsGen.csproj
          --configuration Release --no-build --
          verify --dir artifacts/docs

      - name: Auditar a documentação (falha em drift hard)
        run: >
          dotnet run --project tools/docs-gen/OpBlazorUI.DocsGen.csproj
          --configuration Release --no-build --
          audit --mode fail --report artifacts/docs/docs-audit.json

      - name: Publicar os artefatos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-artifacts
          path: artifacts/docs
          if-no-files-found: warn
